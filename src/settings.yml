- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  category: custom,calendar
  description: Plan breakfast, lunch, and dinner for every day of the week. Source code and documentation are available on <a href="https://github.com/michaelkurath/TRMNL_Weekly-Meal-Planner" target="_blank" rel="noopener">GitHub</a>.
